name: Website QA

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"   # every Monday, checks the live site
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r qa/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run functional, accessibility and visual checks
        working-directory: qa
        run: python run.py
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-report
          path: |
            qa/reports/report.html
            qa/reports/report.json
            qa/reports/screenshots
            qa/reports/diffs
