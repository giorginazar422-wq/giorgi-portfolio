<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>The City Opens — Interactive Film</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#05070d;color:#f2f4f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}
.hero{position:relative;isolation:isolate;width:100%;height:100vh;height:100dvh;overflow:hidden;touch-action:none;background:#05070d}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s;pointer-events:none;will-change:transform}
video.ready{opacity:1}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,13,.35),transparent 30%,rgba(5,7,13,.15) 70%,rgba(5,7,13,.55));pointer-events:none}
.center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 6%;pointer-events:none;will-change:transform,opacity,filter}
h1{font-size:clamp(30px,7vw,96px);font-weight:800;letter-spacing:-.02em;line-height:1;margin:0;text-shadow:0 4px 30px #0008}
.tagline{font-size:clamp(20px,3.4vw,40px);font-weight:700;letter-spacing:-.01em;line-height:1.2;text-shadow:0 4px 24px #0008;opacity:0}
.hint{position:absolute;left:50%;bottom:clamp(64px,11vh,100px);transform:translateX(-50%);display:flex;align-items:center;flex-direction:column;gap:8px;font-size:12px;font-weight:600;letter-spacing:.3em;color:#f0f4f8bf;transition:opacity .4s;pointer-events:none}.hint svg{animation:bounce 1.6s ease-in-out infinite}@keyframes bounce{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(5px);opacity:1}}
.line{position:absolute;bottom:0;left:0;width:100%;height:2px;background:#ffffff20}.line i{display:block;height:100%;background:linear-gradient(90deg,#ffffff80,#fffffff2);transform:scaleX(0);transform-origin:left}
.credit{position:absolute;right:clamp(12px,2.5vw,24px);bottom:max(15px,env(safe-area-inset-bottom));font-size:clamp(11px,1.4vw,13px);color:#dce0e899}.credit a{color:inherit;text-decoration:none}.credit a:hover,.credit a:focus-visible{color:white}
.controls{position:absolute;bottom:max(42px,calc(env(safe-area-inset-bottom) + 24px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;width:min(270px,70vw);z-index:3;touch-action:auto}
.controls input{width:100%;height:18px;accent-color:#fff;cursor:pointer}.controls button{background:#05070d88;color:#fff;border:1px solid #ffffff55;border-radius:100%;width:30px;height:30px;flex-shrink:0;cursor:pointer}.controls button:focus-visible,.controls input:focus-visible{outline:2px solid white;outline-offset:3px}
.status{position:absolute;top:20px;left:50%;transform:translateX(-50%);text-align:center;color:#f2f4f8b0;font-size:12px;max-width:90%;margin:0}.status:empty{display:none}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="hero" id="hero" aria-label="The City Opens interactive video">
<video id="film" muted playsinline preload="auto" src="https://cdn.21st.dev/assets/mirror/21/21a77eac28eacbb7e142016eefeaa0b4a766619e51113629a3bc6df6af066c0f.mp4"></video>
<div class="shade"></div>
<div class="center" id="title"><h1>THE CITY OPENS</h1></div>
<div class="center tagline" id="tagline">Every door in the city is already open.</div>
<div class="hint" id="hint"><span>SCROLL</span><svg width="14" height="18" viewBox="0 0 14 18" aria-hidden="true"><path d="M7 1L7 17M2 12L7 17L12 12" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<p class="status" id="status" role="status">Loading film…</p>
<div class="controls"><button type="button" id="back" aria-label="Restart film">↺</button><input type="range" id="scrubber" min="0" max="1000" value="0" aria-label="Film progress"></div>
<div class="line" aria-hidden="true"><i id="bar"></i></div>
<div class="credit">by <a href="https://www.guglielmogiannattasio.it" target="_blank" rel="noopener noreferrer">guglielmogiannattasio.exe</a></div>
</main>
<script>
(()=>{"use strict";const hero=document.getElementById("hero"),v=document.getElementById("film"),title=document.getElementById("title"),tag=document.getElementById("tagline"),hint=document.getElementById("hint"),bar=document.getElementById("bar"),range=document.getElementById("scrubber"),status=document.getElementById("status");const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));let target=0,progress=0,lastTouch=null,raf=0,started=false;
function update(n){target=clamp(n);if(target>.001)started=true}
function prime(){if(v.readyState>=2)return;const p=v.play();if(p)p.then(()=>v.pause()).catch(()=>{});}
function ready(){v.classList.add("ready");status.textContent="";v.pause()}
v.addEventListener("loadeddata",ready);v.addEventListener("canplay",ready);if(v.readyState>=2)ready();v.addEventListener("error",()=>{status.textContent="Video could not load. Check your connection and refresh.";});prime();
hero.addEventListener("wheel",e=>{if(e.ctrlKey||e.target.closest(".controls")||reduced)return;e.preventDefault();const unit=e.deltaMode===1?16:e.deltaMode===2?innerHeight:1;update(target+e.deltaY*unit/3200);prime()},{passive:false});
hero.addEventListener("touchstart",e=>{if(e.target.closest(".controls")||e.touches.length!==1){lastTouch=null;return}lastTouch=e.touches[0].clientY;prime()},{passive:true});
hero.addEventListener("touchmove",e=>{if(lastTouch===null||e.touches.length!==1||reduced)return;const y=e.touches[0].clientY;update(target+(lastTouch-y)/3200);lastTouch=y;if(e.cancelable)e.preventDefault()},{passive:false});
for(const event of ["touchend","touchcancel"])hero.addEventListener(event,()=>lastTouch=null,{passive:true});
range.addEventListener("input",()=>{update(Number(range.value)/1000);prime()});document.getElementById("back").addEventListener("click",()=>{target=0;started=false;prime()});
window.addEventListener("keydown",e=>{if(e.target.closest("input,button,a")||e.ctrlKey||e.metaKey||e.altKey)return;let n=target;if(["ArrowDown","ArrowRight","PageDown"," "].includes(e.key))n+=.06;else if(["ArrowUp","ArrowLeft","PageUp"].includes(e.key))n-=.06;else if(e.key==="Home")n=0;else if(e.key==="End")n=1;else return;e.preventDefault();update(n);prime()});
function frame(){progress=reduced?target:progress+(target-progress)*.18;if(Math.abs(target-progress)<.0001)progress=target;const d=v.duration;if(Number.isFinite(d)&&d>0&&!v.seeking&&v.readyState>=1){const t=clamp(progress*d,0,Math.max(0,d-.015));if(Math.abs(v.currentTime-t)>.015)v.currentTime=t}v.style.transform=reduced?"none":"scale("+(1+progress*.06)+")";const a=1-clamp(progress/.35),b=clamp((progress-.82)/.18);title.style.opacity=a;title.style.transform=reduced?"none":"translateY("+((1-a)*-24)+"px) scale("+(.96+a*.04)+")";title.style.filter=reduced?"none":"blur("+((1-a)*10)+"px)";tag.style.opacity=b;tag.style.transform=reduced?"none":"translateY("+((1-b)*20)+"px) scale("+(.97+b*.03)+")";tag.style.filter=reduced?"none":"blur("+((1-b)*8)+"px)";hint.style.opacity=started?"0":"1";bar.style.transform="scaleX("+progress+")";if(document.activeElement!==range)range.value=Math.round(target*1000);raf=requestAnimationFrame(frame)}
raf=requestAnimationFrame(frame);window.addEventListener("pagehide",()=>{cancelAnimationFrame(raf);v.pause()});window.addEventListener("pageshow",e=>{if(e.persisted)raf=requestAnimationFrame(frame)});
})();
</script>
</body></html>
